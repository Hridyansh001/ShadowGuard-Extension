<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShadowGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      background: #080b0f;
      color: #e2e8f0;
      font-family: ui-monospace, 'Cascadia Code', monospace;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(#1e283218 1px, transparent 1px),
        linear-gradient(90deg, #1e283218 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap { position: relative; z-index: 1; }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #1e2832;
      background: rgba(8,11,15,0.9);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .shield-icon {
      width: 30px; height: 30px;
      background: #141a22;
      border: 1px solid #263040;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .brand-text {
      font-family: system-ui, sans-serif;
      font-size: 16px;
      font-weight: 800;
    }
    .brand-text span { color: #f97316; }

    /* Toggle switch */
    .toggle-wrap { display: flex; align-items: center; gap: 8px; }
    .toggle-label { font-size: 9px; color: #64748b; letter-spacing: 0.08em; text-transform: uppercase; }
    .toggle {
      position: relative;
      width: 38px; height: 20px;
      background: #1e2832;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid #263040;
      transition: all 0.2s;
    }
    .toggle.active { background: #15803d; border-color: #16a34a; }
    .toggle::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      background: #64748b;
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: all 0.2s;
    }
    .toggle.active::after { background: #22c55e; left: 20px; }

    /* ── STATUS CARD ── */
    .status-card {
      margin: 12px 12px 0;
      background: #0e1318;
      border: 1px solid #1e2832;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s ease-in-out infinite;
    }
    .status-dot.inactive { background: #475569; }
    .status-text { flex: 1; }
    .status-title { font-size: 11px; color: #e2e8f0; font-weight: 700; margin-bottom: 2px; }
    .status-sub { font-size: 9px; color: #64748b; letter-spacing: 0.04em; }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 12px 0;
    }
    .stat-card {
      background: #0e1318;
      border: 1px solid #1e2832;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-value { font-size: 20px; font-weight: 800; font-family: system-ui, sans-serif; line-height: 1; }
    .stat-label { font-size: 8px; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }
    .stat-card.blocked { border-color: #7f1d1d; background: #1a0a0a; }
    .stat-card.blocked .stat-value { color: #ef4444; }
    .stat-card.warning { border-color: #78350f; background: #1a1200; }
    .stat-card.warning .stat-value { color: #f59e0b; }
    .stat-card.safe { border-color: #14532d; background: #071a0f; }
    .stat-card.safe .stat-value { color: #22c55e; }

    /* ── LAST SCAN ── */
    .section-title {
      font-size: 9px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 12px 12px 6px;
    }
    .last-scan {
      margin: 0 12px;
      background: #0e1318;
      border: 1px solid #1e2832;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .last-scan.blocked { border-color: #7f1d1d; }
    .last-scan.warning { border-color: #78350f; }
    .last-scan.safe { border-color: #14532d; }
    .last-scan-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .verdict-badge {
      display: flex; align-items: center; gap: 4px;
      border: 1px solid; border-radius: 4px;
      padding: 2px 7px;
      font-size: 8px; font-weight: 700; letter-spacing: 0.08em;
    }
    .verdict-badge.blocked { color: #ef4444; border-color: #7f1d1d; background: #1a0a0a; }
    .verdict-badge.warning { color: #f59e0b; border-color: #78350f; background: #1a1200; }
    .verdict-badge.safe { color: #22c55e; border-color: #14532d; background: #071a0f; }
    .scan-time { font-size: 9px; color: #475569; }
    .scan-text {
      font-size: 10px; color: #94a3b8;
      overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .no-scan { font-size: 10px; color: #475569; text-align: center; padding: 6px 0; }

    /* ── HISTORY ── */
    .history-list {
      margin: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 120px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #0e1318;
      border: 1px solid #1e2832;
      border-radius: 6px;
      border-left: 2px solid;
    }
    .history-item.blocked { border-left-color: #ef4444; }
    .history-item.warning { border-left-color: #f59e0b; }
    .history-item.safe    { border-left-color: #22c55e; }
    .history-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .history-dot.blocked { background: #ef4444; }
    .history-dot.warning { background: #f59e0b; }
    .history-dot.safe    { background: #22c55e; }
    .history-text { flex: 1; font-size: 9px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-time { font-size: 8px; color: #475569; flex-shrink: 0; }

    /* ── FOOTER ── */
    .footer {
      display: flex;
      gap: 6px;
      padding: 12px;
      border-top: 1px solid #1e2832;
      margin-top: 12px;
    }
    .btn {
      flex: 1;
      padding: 8px;
      border-radius: 7px;
      border: 1px solid #263040;
      background: #141a22;
      color: #94a3b8;
      font-family: ui-monospace, monospace;
      font-size: 9px;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.15s;
      text-align: center;
    }
    .btn:hover { border-color: #f97316; color: #f97316; }
    .btn.danger:hover { border-color: #ef4444; color: #ef4444; }

    /* ── EMPTY STATE ── */
    .empty { font-size: 9px; color: #334155; text-align: center; padding: 8px 0; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
      50% { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="shield-icon">🛡️</div>
      <div class="brand-text">Shadow<span>Guard</span></div>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="toggle-label">ON</span>
      <div class="toggle active" id="toggle"></div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-card" id="status-card">
    <div class="status-dot active" id="status-dot"></div>
    <div class="status-text">
      <div class="status-title" id="status-title">Protection Active</div>
      <div class="status-sub" id="status-sub">Monitoring all inputs in real time</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card blocked">
      <div class="stat-value" id="stat-blocked">0</div>
      <div class="stat-label">Blocked</div>
    </div>
    <div class="stat-card warning">
      <div class="stat-value" id="stat-warning">0</div>
      <div class="stat-label">Warnings</div>
    </div>
    <div class="stat-card safe">
      <div class="stat-value" id="stat-safe">0</div>
      <div class="stat-label">Safe</div>
    </div>
  </div>

  <!-- Last scan -->
  <div class="section-title">Last Scan</div>
  <div class="last-scan" id="last-scan-card">
    <div class="no-scan" id="no-scan-text">No scans yet this session</div>
    <div id="last-scan-content" style="display:none;">
      <div class="last-scan-top">
        <div class="verdict-badge" id="last-verdict-badge">SAFE</div>
        <div class="scan-time" id="last-scan-time">–</div>
      </div>
      <div class="scan-text" id="last-scan-text">–</div>
    </div>
  </div>

  <!-- History -->
  <div class="section-title">Recent History</div>
  <div class="history-list" id="history-list">
    <div class="empty">No scan history yet</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn" id="btn-dashboard">📊 Dashboard</button>
    <button class="btn danger" id="btn-clear">🗑 Clear History</button>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
